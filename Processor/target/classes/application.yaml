app:
  name: recsys-processor

mysql:
  host: hadoop-master
  port: 3306
  database: movie
  user: root
  password: YourStrongRootPassword123!  # ⚠️ 请修改为实际密码
  params: "useSSL=false&serverTimezone=UTC&characterEncoding=utf8&allowPublicKeyRetrieval=true&rewriteBatchedStatements=true&cachePrepStmts=true&prepStmtCacheSize=500&prepStmtCacheSqlLimit=2048&useServerPrepStmts=true&useLocalSessionState=true&useLocalTransactionState=true&elideSetAutoCommits=true&alwaysSendSetIsolation=false&cacheResultSetMetadata=true&cacheServerConfiguration=true&maintainTimeStats=false"

kafka:
  bootstrapServers: "hadoop-master:9092,hadoop-worker1:9092,hadoop-worker2:9092"
  topicRatings: "ratings"
  topicMovies: "movies"

spark:
  checkpointBase: "/checkpoints/recsys"
  shufflePartitions: 80

hdfs:
  basePath: "/apps/recsys"

# YARN 集群优化配置（8GB Worker 节点）
als:
  rank: 30          # 隐因子维度（提高推荐质量）
  regParam: 0.1     # 正则化参数（标准值）
  maxIter: 10       # 迭代次数（平衡质量和速度）tail -50 /opt/Processor/logs/tmdb-fetcher.log
  
  topN: 30          # 每用户推荐数量
  # 模型持久化基路径（Streaming 回填会按 active_version 从此路径加载模型）
  modelBasePath: "hdfs:///apps/recsys/models/als"

  # 采样与读取并行度
  sampleUserModBase: 100         # 哈希抽样基数 MOD 基
  sampleUserModKeep: 40          # 保留比例（0..base-1 中的阈值）
  includeTopPopularK: 5000       # 额外包含的热门物品覆盖数
  maxRatingsPerUser: 200         # 每用户评分上限（按时间倒序）
  readPartitions: 40             # JDBC 读取分区数
  partitionUpperBound: 5000000   # userId 估计上界（用于 JDBC 分区）


# 实时回填配置（针对新用户快速生成推荐）
realtime:
  minRatingsForFoldIn: 3         # 至少多少条评分才进行折叠求解（fold-in）
  candidateLimit: 10000          # 候选物品规模（从热门里选）
  microBatch: "5 seconds"        # Structured Streaming 触发间隔


